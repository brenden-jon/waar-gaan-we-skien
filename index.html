<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Waar gaan we skiën?</title>
<style>
  :root{--ink:#101C26;--ink-2:#3D5261;--ink-3:#6E8492;--paper:#E9EDEF;--surface:#FFFFFF;
    --line:#CFD8DD;--accent:#0E6E86;--over:#A93B2C;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ink:#E4EBEF;--ink-2:#A3B5C0;--ink-3:#7B8F9C;--paper:#0A1219;--surface:#111D25;
    --line:#25363F;--accent:#4FB3CE;--over:#E0705C;}}
  :root[data-theme="dark"]{--ink:#E4EBEF;--ink-2:#A3B5C0;--ink-3:#7B8F9C;--paper:#0A1219;
    --surface:#111D25;--line:#25363F;--accent:#4FB3CE;--over:#E0705C;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
    font-family:var(--sans);display:grid;place-items:center;padding:24px}
  .box{background:var(--surface);border:1px solid var(--line);max-width:410px;width:100%;
    padding:34px 30px;box-shadow:0 1px 2px rgba(16,28,38,.06),0 20px 44px -24px rgba(16,28,38,.32)}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
    color:var(--ink-3);margin-bottom:12px}
  h1{margin:0 0 8px;font-size:27px;font-weight:800;letter-spacing:-.026em;line-height:1.08}
  h1 em{font-style:normal;color:var(--accent)}
  p{margin:0 0 22px;color:var(--ink-2);font-size:14px;line-height:1.55}
  label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
  input{width:100%;padding:11px 13px;font-family:var(--mono);font-size:15px;
    background:var(--paper);color:var(--ink);border:1px solid var(--line);margin-bottom:14px}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  button{width:100%;padding:12px;font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;
    text-transform:uppercase;background:var(--ink);color:var(--paper);border:none;cursor:pointer}
  button:hover{background:var(--accent)}
  button:disabled{opacity:.55;cursor:progress}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .msg{margin:14px 0 0;font-family:var(--mono);font-size:12px;color:var(--over);min-height:17px}
  .msg.busy{color:var(--ink-3)}
</style>
</head>
<body>
<form class="box" id="f">
  <div class="eyebrow">Oud &amp; nieuw 2026 &middot; 10 personen</div>
  <h1>Waar gaan we <em>skiën</em>?</h1>
  <p>Deze pagina is versleuteld. Vul het wachtwoord in dat je van Brenden hebt gekregen.</p>
  <label for="p">Wachtwoord</label>
  <input id="p" type="password" autocomplete="current-password" autofocus>
  <button id="b" type="submit">Openen</button>
  <p class="msg" id="m" role="status" aria-live="polite"></p>
</form>
